name: Android checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Update policy regression checks
        run: bash scripts/test-update-policy.sh
      - name: Build and Android lint
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug --no-daemon
