plugins { id 'com.android.application' }

android {
    namespace 'br.com.espectro'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.espectro'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        buildConfigField 'String', 'UPDATE_REPOSITORY', '"PANTANO2002/espectro-android"'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
}
